<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kiez tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body class="tour-body">
  <div class="stage">
    <div id="map" role="application" aria-label="Berlin neighborhood map"></div>
    <div class="loader" id="loader">
      <div>
        Building this Kiez
        <ul>
          <li class="on">Matching the address</li>
          <li>Reading the streets</li>
          <li>Finding nearby places</li>
          <li>Timing the first walks</li>
        </ul>
      </div>
    </div>
    <div class="map-ui">
      <form class="addr" id="addr-form">
        <input id="address" name="q" aria-label="Listing address" />
        <button class="go" type="submit">Create</button>
      </form>
      <div class="cats" role="toolbar" aria-label="Place filters">
        <button class="cat" data-cat="home" aria-pressed="true" type="button">Home</button>
        <button class="cat" data-cat="coffee" aria-pressed="false" type="button">Coffee</button>
        <button class="cat" data-cat="grocery" aria-pressed="false" type="button">Grocery</button>
        <button class="cat" data-cat="park" aria-pressed="false" type="button">Park</button>
        <button class="cat" data-cat="eat" aria-pressed="false" type="button">Restaurant</button>
      </div>
      <div class="place-card" id="place-card">
        <div class="k">Home</div>
        <h3 id="listing-name">Berlin</h3>
        <p>Building tour</p>
      </div>
      <div class="trip-card">
        <h3>Plan your trip</h3>
        <form id="commute-form">
          <input id="commute" placeholder="Workplace or school in Berlin" />
          <div class="row">
            <select id="mode" aria-label="Mode">
              <option value="drive">Drive</option>
              <option value="walk">Walk</option>
            </select>
            <button class="btn" type="submit" style="padding:8px 14px">Time it</button>
          </div>
        </form>
        <div class="row" style="margin-top:8px">
          <button class="btn ghost" id="play-route" type="button" style="padding:8px 14px">Experience trip</button>
          <button class="btn ghost" id="share" type="button" style="padding:8px 14px">Share</button>
        </div>
        <div class="status" id="status"></div>
      </div>
    </div>
  </div>
  <div class="modal" id="share-modal" hidden>
    <div class="sheet">
      <h2>Share this tour</h2>
      <input id="share-url" readonly />
      <div class="row">
        <img id="qr" alt="QR code" width="160" height="160" />
        <button class="btn" id="copy-link" type="button">Copy link</button>
      </div>
      <textarea id="embed" readonly></textarea>
      <button class="btn ghost" id="close-share" type="button">Close</button>
    </div>
  </div>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="assets/app.js"></script>
  <script>Kiez.boot();</script>
</body>
</html>
